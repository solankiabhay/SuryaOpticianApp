name: Android build and tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      SURYA_VERSION_CODE: ${{ github.run_number + 1 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore persistent APK signing key
        shell: bash
        env:
          SURYA_BOOTSTRAP_PASSWORD: ${{ secrets.SURYA_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SURYA_BOOTSTRAP_PASSWORD:-}" ]]; then
            echo "::error::Add the SURYA_BOOTSTRAP_PASSWORD repository secret before building."
            exit 1
          fi
          ENCRYPTED_KEYSTORE=".github/signing/surya-upload-key.jks.enc"
          if [[ ! -s "$ENCRYPTED_KEYSTORE" ]]; then
            echo "::error::Encrypted signing key is missing. Run the 'Initialize Surya signing key' workflow once."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/surya-upload-key.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$ENCRYPTED_KEYSTORE" -out "$KEYSTORE_PATH" \
            -pass env:SURYA_BOOTSTRAP_PASSWORD
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$SURYA_BOOTSTRAP_PASSWORD" -alias surya-upload >/dev/null
          echo "SURYA_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SURYA_KEYSTORE_PASSWORD=$SURYA_BOOTSTRAP_PASSWORD" >> "$GITHUB_ENV"
          echo "SURYA_KEY_ALIAS=surya-upload" >> "$GITHUB_ENV"
          echo "SURYA_KEY_PASSWORD=$SURYA_BOOTSTRAP_PASSWORD" >> "$GITHUB_ENV"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null

      - name: Install Android platform and build tools
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          java -version
          gradle --version
          "$SDKMANAGER" --list_installed

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build installable APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/surya.apk

      - name: Upload Surya APK
        uses: actions/upload-artifact@v4
        with:
          name: surya-apk
          path: app/build/outputs/apk/debug/surya.apk
          if-no-files-found: error
          retention-days: 14
